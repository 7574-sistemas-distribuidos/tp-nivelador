services:
  server:
    container_name: server
    build:
      context: ./services/server
      dockerfile: Dockerfile
    environment:
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=server
    - SERVER_PORT=5678
  client1:
    container_name: client1
    build:
      context: ./services/client
      dockerfile: Dockerfile
    environment:
    - AGENCY_ID=1
    - SERVER_HOST=server
    - SERVER_PORT=5678
    depends_on:
    - server
  client2:
    container_name: client2
    build:
      context: ./services/client
      dockerfile: Dockerfile
    environment:
    - AGENCY_ID=2
    - SERVER_HOST=server
    - SERVER_PORT=5678
    depends_on:
    - server
