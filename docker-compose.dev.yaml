    - AGENCY_ID=3
    - SERVER_HOST=server
    - SERVER_PORT=5678
    depends_on:
    - server
  client4:
    container_name: client4
    build:
      context: ./services/client
      dockerfile: Dockerfile
    environment:
    - AGENCY_ID=4
    - SERVER_HOST=server
    - SERVER_PORT=5678
    depends_on:
    - server
  client5:
    container_name: client5
