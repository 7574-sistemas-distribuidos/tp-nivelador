services:
    server:
        build:
            context: ./services/server
            dockerfile: Dockerfile
        container_name: server
        ports:
            -   "5678:5678"
        environment:
            - PYTHONUNBUFFERED=1
            - SERVER_HOST=server
            - SERVER_PORT=5678

    client_0:
        build:
            context: ./services/client
            dockerfile: Dockerfile
        container_name: client_0
        depends_on:
            - server
        environment:
            - AGENCY_ID=0
            - SERVER_HOST=server
            - SERVER_PORT=5678
            - INPUT_FILE=/input/input-0.csv
            - OUTPUT_FILE=/output/output-0.csv
        volumes:
            - ./input:/input
            - ./output:/output

    client_1:
