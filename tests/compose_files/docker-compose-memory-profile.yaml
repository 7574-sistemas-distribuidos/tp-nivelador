services:
  server:
    build:
      context: ../../services/server
      dockerfile: Dockerfile
    container_name: server
    environment:
      - PYTHONUNBUFFERED=1
      - AGENCY_QUORUM_MIN=2
      - SERVER_HOST=server
      - SERVER_PORT=5678

  client_0:
    build:
      context: ../../services/client
      dockerfile: Dockerfile
    container_name: client_0
    depends_on:
      - server
    environment:
      - AGENCY_ID=0
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - INPUT_FILE=/input/test-data.csv
      - OUTPUT_FILE=/output/output-0.csv
      - BATCH_SIZE=32
      - GOGC=20
      - GOMEMLIMIT=20MiB
    volumes:
      - ../../input:/input
      - ../../output:/output
